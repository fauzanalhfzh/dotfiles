set -g prefix M-a
unbind C-b

set -g mouse on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g history-limit 5000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind | split-window -h
bind - split-window -v

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind -r H resize-pane -L 4
bind -r J resize-pane -D 4
bind -r K resize-pane -U 4
bind -r L resize-pane -R 4

bind S run "tmux list-sessions -F '#{session_name}' | fzf-tmux -p | xargs tmux switch-client -t"
bind w run "tmux list-windows -a -F '#{session_name}:#{window_index} #{window_name}' | fzf-tmux -p | cut -d' ' -f1 | xargs tmux select-window -t"
bind P run "tmux list-panes -a -F '#{session_name}:#{window_index}.#{pane_index} #{pane_title}' | fzf-tmux -p | cut -d' ' -f1 | xargs tmux select-pane -t"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Morantron/tmux-fingers'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Poimandres colors
set -g @poimandres_bg '#1B1E28'
set -g @poimandres_bg_alt '#171922'
set -g @poimandres_bg_hl '#303340'
set -g @poimandres_fg '#E4F0FB'
set -g @poimandres_blue '#ADD7FF'
set -g @poimandres_teal '#5DE4C7'
set -g @poimandres_gray '#A6ACCD'
set -g @poimandres_gray_dim '#767C9D'
set -g @poimandres_pink '#D0679D'
set -g @poimandres_yellow '#FFFAC2'

set -g status-style "bg=#1B1E28,fg=#E4F0FB"
set -g status-justify right
set -g status-left "#{?client_prefix,#[bg=#06B6D4] 🙉🙉🙉 ,#[bg=#5DE4C7] #S }"
set -g status-left-style "fg=#171922,bold"
set -g status-right "#S:#I"
set -g status-left-length 40
set -g status-right-length 80
set -g status-interval 60

set -g window-status-format "#[fg=#767C9D]#I·#[fg=#A6ACCD]#W "
set -g window-status-current-format "#[bg=#303340,fg=#ADD7FF,bold]#I·#[fg=#E4F0FB]#W "
set -g window-status-current-style "bg=#303340"
set -g window-status-separator ""

set -g pane-border-style "fg=#303340"
set -g pane-active-border-style "fg=#5DE4C7"
set -g display-panes-colour "#5DE4C7"
set -g display-panes-active-colour "#ADD7FF"

set -g message-style "bg=#303340,fg=#E4F0FB"
set -g message-command-style "bg=#303340,fg=#E4F0FB"
set -g mode-style "bg=#ADD7FF,fg=#171922"

run '~/.config/tmux/plugins/tpm/tpm'
